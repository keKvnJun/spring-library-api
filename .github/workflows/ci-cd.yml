name: CI and CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test with temporary PostgreSQL
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: spring_library_ci
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d spring_library_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATASOURCE_URL: jdbc:postgresql://localhost:5432/spring_library_ci
      DATASOURCE_USERNAME: ci_user
      DATASOURCE_PASSWORD: ci_only_password

    steps:
      - name: Check out source code
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run Maven Wrapper build and tests
        run: ./mvnw --batch-mode verify

  deploy:
    name: Deploy to Railway
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}

    steps:
      - name: Check out source code
        uses: actions/checkout@v7

      - name: Set up Node.js for Railway CLI
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install Railway CLI
        run: npm install --global @railway/cli@5.71.0

      - name: Deploy to Railway
        run: railway up --ci --project "$RAILWAY_PROJECT_ID" --environment production --service spring-library-api