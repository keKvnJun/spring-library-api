spring:
  datasource:
    url: ${DATASOURCE_URL}
    username: ${DATASOURCE_USERNAME}
    password: ${DATASOURCE_PASSWORD}

  config:
    import: optional:file:.env[.properties]

  application:
    name: spring-library-api

  jpa:
    # Show generated SQL queries in the console.
    show-sql: true

    # Update the database schema based on mapped entities.
    hibernate:
      ddl-auto: update

server:
  port: ${PORT:8080}